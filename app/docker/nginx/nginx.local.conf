events {
    worker_connections 1024;
}

http {
    # Локальные сервера
    upstream app_servers {
        server host.docker.internal:8080;
    }

    upstream minio_console {
        server host.docker.internal:9001;
    }

    upstream redis_commander {
        server host.docker.internal:8081;
    }

    upstream pgadmin {
        server host.docker.internal:5050;
    }

    server {
        listen 80;
        server_name localhost;

        # Локальные логи (опционально)
        access_log /var/log/nginx/local-access.log;
        error_log /var/log/nginx/local-error.log;

        # Главная страница - редирект на приложение
        location = / {
            proxy_pass http://app_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Статические файлы приложения
        location /static/ {
            proxy_pass http://app_servers/static/;
            proxy_set_header Host $host;
        }

        # WebSocket для чата
        location /ws {
            proxy_pass http://app_servers/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # API запросы
        location /api/ {
            proxy_pass http://app_servers/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # MinIO Console
        location /minio/ {
            proxy_pass http://minio_console/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redis Commander
        location /redis/ {
            proxy_pass http://redis_commander/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # pgAdmin
        location /pgadmin/ {
            proxy_pass http://pgadmin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Script-Name /pgadmin;
        }

        # Healthcheck для Docker
        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Дополнительный сервер для прямого доступа к MinIO (опционально)
    server {
        listen 81;
        server_name localhost;

        location / {
            proxy_pass http://minio_console;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}