global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'pigeongram'

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'pigeongram_app'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    metrics_path: '/metrics'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    metrics_path: '/metrics'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: '/metrics'

  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: '/minio/metrics/v3/cluster'  # или правильный путь для вашей версии
    scrape_interval: 30s
    scheme: 'http'
    authorization:
      credentials_file: '/etc/prometheus/minio-token'  # 👈 читаем токен из файла
      type: Bearer