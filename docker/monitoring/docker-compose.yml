version: '3.8'

services:
  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    container_name: pigeongram_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
      - ./minio-token:/etc/prometheus/minio-token:rw
      - ./scripts:/scripts:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - pigeongram_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MINIO_CONTAINER=pigeongram_minio
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin

  grafana:
    image: grafana/grafana:latest
    container_name: pigeongram_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - pigeongram_network
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: pigeongram_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - pigeongram_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: pigeongram_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8082:8080"
    networks:
      - pigeongram_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: pigeongram_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://pigeongram:pigeongram_secret@host.docker.internal:5432/pigeongram?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - pigeongram_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: pigeongram_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: host.docker.internal:6379
      REDIS_PASSWORD: redis_secret
    ports:
      - "9121:9121"
    networks:
      - pigeongram_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 👇 Добавляем сервис для периодического обновления токена
  token-updater:
    image: alpine:latest
    container_name: pigeongram_token_updater
    restart: unless-stopped
    volumes:
      - ./scripts:/scripts:ro
      - ./minio-token:/etc/prometheus/minio-token:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: |
      sh -c '
      apk add --no-cache docker-cli curl;
      while true; do
        echo "[$$(date)] Updating MinIO token...";
        /scripts/update-minio-token.sh;
        echo "[$$(date)] Next update in 1 hour";
        sleep 3600;
      done'
    networks:
      - pigeongram_network
    environment:
      - MINIO_CONTAINER=pigeongram_minio
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - PROMETHEUS_URL=http://prometheus:9090

networks:
  pigeongram_network:
    external: true

volumes:
  prometheus_data:
  grafana_data: