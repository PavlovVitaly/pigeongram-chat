services:
  prometheus:
    image: prom/prometheus:latest
    container_name: pigeongram_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - pigeongram_network

  grafana:
    image: grafana/grafana:latest
    container_name: pigeongram_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    depends_on:
      - prometheus
    networks:
      - pigeongram_network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: pigeongram_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - pigeongram_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: pigeongram_cadvisor
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    networks:
      - pigeongram_network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: pigeongram_redis_exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
    networks:
      - pigeongram_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: pigeongram_postgres_exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-pigeongram}:${DB_PASSWORD:-pigeongram_secret}@postgres:5432/${DB_NAME:-pigeongram}?sslmode=disable"
    networks:
      - pigeongram_network

volumes:
  prometheus_data:
    name: pigeongram_prometheus_data
  grafana_data:
    name: pigeongram_grafana_data

networks:
  pigeongram_network:
    external: true