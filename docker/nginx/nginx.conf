events {
    worker_connections 1024;
}

http {
    # Для балансировки между экземплярами приложения (если несколько)
    upstream app_servers {
        # Используем least_conn для балансировки по количеству соединений
        least_conn;
        
        # Сервера PigeonGram — внутри Docker сети используем имена контейнеров
        server pigeongram_app:8080;           # 👈 ИЗМЕНЕНО: используем имя контейнера
        
        # Проверка здоровья
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;              # 👈 ИЗМЕНЕНО: для любого домена

        # Увеличиваем лимиты для загрузки файлов
        client_max_body_size 100M;

        # Статические файлы
        location /static/ {
            proxy_pass http://pigeongram_app:8080/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket соединения
        location /ws {
            proxy_pass http://pigeongram_app:8080/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Таймауты для WebSocket
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # MinIO API (через Nginx)
        location /minio/ {
            proxy_pass http://minio:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Увеличиваем лимиты для загрузки файлов
            client_max_body_size 100M;
            proxy_request_buffering off;
        }

        # MinIO Console (опционально)
        location /minio-console/ {
            proxy_pass http://minio:9001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API приложения
        location /api/ {
            proxy_pass http://pigeongram_app:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Основное приложение
        location / {
            proxy_pass http://pigeongram_app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}