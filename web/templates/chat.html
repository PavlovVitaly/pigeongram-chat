<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Групповой чат (WebSocket)</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h3>Групповой чат</h3>
            <div class="user-info">
                Вы вошли как: <strong id="current-user">{{.}}</strong>
                <span class="connection-status" id="connection-status">(подключение...)</span>
                <!-- Перейти в хранилище -->
                <button onclick="goToFileStorage()" class="btn-small btn-success">
                    📁 Файлы
                </button>
                <button id="logout-button" class="logout-button">Выйти</button>
            </div>
        </div>
        
        <div class="messages-container" id="messages">
            <!-- Сообщения будут добавляться сюда -->
        </div>
        
        <form id="message-form" class="message-form" onsubmit="sendMessage(event)">
            <input type="text" 
                   id="message-input" 
                   class="message-input" 
                   placeholder="Введите сообщение..." 
                   autocomplete="off" 
                   required
                   disabled>
            <button type="submit" class="send-button" id="send-button" disabled>Отправить</button>
        </form>
    </div>

    <script>
        const username = '{{.}}';
        let socket = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        let isLoggingOut = false; // Флаг для отслеживания выхода

        // Функция для перехода в хранилище
        function goToFileStorage() {
            window.location.href = '/files?chat_id=general';
        }

        // Функция для создания WebSocket соединения
        function connectWebSocket() {
            // Не подключаемся, если происходит выход
            if (isLoggingOut) {
                return;
            }
            
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            socket = new WebSocket(wsUrl);
            
            socket.onopen = function(e) {
                console.log('WebSocket соединение установлено');
                document.getElementById('connection-status').textContent = '(онлайн)';
                document.getElementById('connection-status').style.color = '#4caf50';
                document.getElementById('message-input').disabled = false;
                document.getElementById('send-button').disabled = false;
                reconnectAttempts = 0;
            };
            
            socket.onmessage = function(event) {
                const message = JSON.parse(event.data);
                addMessage(message);
            };
            
            socket.onclose = function(event) {
                console.log('WebSocket соединение закрыто');
                document.getElementById('connection-status').textContent = '(офлайн)';
                document.getElementById('connection-status').style.color = '#f44336';
                document.getElementById('message-input').disabled = true;
                document.getElementById('send-button').disabled = true;
                
                // Пытаемся переподключиться, только если это не запланированный выход
                if (!isLoggingOut && reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    console.log(`Попытка переподключения ${reconnectAttempts}...`);
                    setTimeout(connectWebSocket, 3000);
                }
            };
            
            socket.onerror = function(error) {
                console.error('Ошибка WebSocket:', error);
            };
        }

        // Функция для выхода из системы
        async function logout() {
            if (confirm('Вы действительно хотите выйти?')) {
                isLoggingOut = true;
                
                // Закрываем WebSocket соединение
                if (socket) {
                    socket.close();
                }
                
                try {
                    // Отправляем запрос на выход
                    const response = await fetch('/logout', {
                        method: 'GET',
                        credentials: 'same-origin'
                    });
                    
                    if (response.redirected) {
                        // Перенаправляем на страницу входа
                        window.location.href = response.url;
                    } else {
                        // Если нет редиректа, перенаправляем вручную
                        window.location.href = '/';
                    }
                } catch (error) {
                    console.error('Ошибка при выходе:', error);
                    // В случае ошибки все равно перенаправляем на главную
                    window.location.href = '/';
                }
            }
        }

        // Функция для добавления сообщения в чат
        function addMessage(message) {
            const messagesContainer = document.getElementById('messages');
            const messageElement = createMessageElement(message);
            messagesContainer.appendChild(messageElement);
            
            // Прокрутка вниз
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Создание элемента сообщения
        function createMessageElement(message) {
            const div = document.createElement('div');
            div.className = 'message';
            
            // Добавляем класс для своих сообщений
            if (message.username === username) {
                div.classList.add('own-message');
            }
            
            const time = new Date(message.timestamp);
            const timeStr = time.toLocaleTimeString('ru-RU', { 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit'
            });
            
            div.innerHTML = `
                <div class="message-header">
                    <span class="message-username">${escapeHtml(message.username)}</span>
                    <span class="message-time">${timeStr}</span>
                </div>
                <div class="message-text">${escapeHtml(message.text)}</div>
            `;
            
            return div;
        }

        // Экранирование HTML
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Отправка сообщения
        function sendMessage(event) {
            event.preventDefault();
            
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            
            if (message && socket && socket.readyState === WebSocket.OPEN) {
                // Отправляем через WebSocket
                socket.send(JSON.stringify({
                    text: message
                }));
                
                input.value = '';
            }
        }

        // Подключаемся при загрузке страницы
        window.onload = function() {
            connectWebSocket();
            
            // Добавляем обработчик для кнопки выхода
            document.getElementById('logout-button').addEventListener('click', logout);
        };

        // Обработка нажатия Enter
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(e);
            }
        });

        // Защита от случайного закрытия страницы
        window.onbeforeunload = function() {
            if (socket && socket.readyState === WebSocket.OPEN && !isLoggingOut) {
                socket.close();
            }
        };
    </script>
</body>
</html>
