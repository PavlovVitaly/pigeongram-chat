global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'pigeongram'

scrape_configs:
  - job_name: 'pigeongram_app'
    static_configs:
      - targets: ['pigeongram_app:8080']
    metrics_path: '/metrics'

  - job_name: 'node'
    static_configs:
      - targets: ['pigeongram_node_exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['pigeongram_cadvisor:8080']

  - job_name: 'postgres'
    static_configs:
      - targets: ['pigeongram_postgres_exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['pigeongram_redis_exporter:9121']