version: '3.8'

services:
  # ========== POSTGRESQL ==========
  postgres:
    image: postgres:15-alpine
    container_name: pigeongram_postgres
    restart: unless-stopped
    env_file:
      - ./config/.env.production
    environment:
      POSTGRES_USER: ${DB_USER:-pigeongram}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pigeongram123}
      POSTGRES_DB: ${DB_NAME:-pigeongram}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=ru_RU.UTF-8"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      PGTZ: Europe/Moscow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./logs:/var/log/postgresql
    networks:
      - pigeongram_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pigeongram} -d ${DB_NAME:-pigeongram}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========== PGADMIN ==========
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pigeongram_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - pigeongram_network
    depends_on:
      postgres:
        condition: service_healthy

  # ========== REDIS ==========
  redis:
    image: redis:7-alpine
    container_name: pigeongram_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    networks:
      - pigeongram_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== REDIS COMMANDER ==========
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: pigeongram_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-redis123}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    networks:
      - pigeongram_network
    depends_on:
      redis:
        condition: service_healthy

  # ========== MINIO ==========
  minio:
    image: minio/minio:latest
    container_name: pigeongram_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - pigeongram_network
    command: server /data --address ":9000" --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ========== GO ПРИЛОЖЕНИЕ ==========
  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    container_name: pigeongram_app
    restart: unless-stopped
    volumes:
      - ./logs/app:/app/logs
    env_file:
      - ./config/.env.production
    networks:
      - pigeongram_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pigeongram}
      DB_PASSWORD: ${DB_PASSWORD:-pigeongram123}
      DB_NAME: ${DB_NAME:-pigeongram}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-pigeongram-files}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_PUBLIC_URL: http://45.8.97.91

  # ========== NGINX ==========
  nginx:
    image: nginx:alpine
    container_name: pigeongram_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - pigeongram_network
    depends_on:
      - app
      - minio

  # ========== PROMETHEUS ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: pigeongram_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=http://45.8.97.91/prometheus/'
      - '--web.route-prefix=/'
    networks:
      - pigeongram_network

  # ========== GRAFANA ==========
  grafana:
    image: grafana/grafana:latest
    container_name: pigeongram_grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://45.8.97.91/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ENFORCE_DOMAIN=false
      - GF_SERVER_ROUTER_LOGGING=true
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    networks:
      - pigeongram_network
    depends_on:
      - prometheus

  # ========== NODE EXPORTER ==========
  node-exporter:
    image: prom/node-exporter:latest
    container_name: pigeongram_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - pigeongram_network

  # ========== CADVISOR ==========
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: pigeongram_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    networks:
      - pigeongram_network

  # ========== REDIS EXPORTER ==========
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: pigeongram_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    networks:
      - pigeongram_network
    depends_on:
      - redis

  # ========== POSTGRES EXPORTER ==========
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: pigeongram_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-pigeongram}:${DB_PASSWORD:-pigeongram123}@postgres:5432/${DB_NAME:-pigeongram}?sslmode=disable"
    networks:
      - pigeongram_network
    depends_on:
      - postgres

# ========== СЕТЬ ==========
networks:
  pigeongram_network:
    driver: bridge

# ========== ТОМА ==========
volumes:
  postgres_data:
    name: pigeongram_postgres_data
  pgadmin_data:
    name: pigeongram_pgadmin_data
  redis_data:
    name: pigeongram_redis_data
  minio_data:
    name: pigeongram_minio_data
  nginx_cache:
    name: pigeongram_nginx_cache
  prometheus_data:
    name: pigeongram_prometheus_data
  grafana_data:
    name: pigeongram_grafana_data
